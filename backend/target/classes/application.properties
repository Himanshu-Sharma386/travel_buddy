spring.application.name=backend
server.port=8080

# Database Configuration (H2 for easy setup, switch to MySQL later if needed)
spring.datasource.url=jdbc:h2:mem:travelbuddy;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# External APIs (Placeholders)
google.places.api.key=YOUR_GOOGLE_API_KEY
openweathermap.api.key=YOUR_WEATHER_API_KEY
openai.api.key=YOUR_OPENAI_API_KEY
gemini.api.key=YOUR_GEMINI_API_KEY

# Hotels provider configuration
# Set hotels.provider=rapidapi to use RapidAPI Hotels endpoints. Leave as 'mock' to use built-in mocked hotels.
hotels.provider=mock
# RapidAPI example settings (required when hotels.provider=rapidapi)
hotels.rapidapi.host=YOUR_RAPIDAPI_HOST  # e.g., "hotels4.p.rapidapi.com"
hotels.rapidapi.key=YOUR_RAPIDAPI_KEY
hotels.rapidapi.endpoint=https://{host}/properties/list

